[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "Better-SSH"
version = "0.1.0"
description = "A lightweight SSH/SCP client built for CTFs, labs, and experimentation."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Shyjin S. Antony" },
]
dependencies = [
    "paramiko>=3.5,<4",
    "scp>=0.15,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.8,<1",
]

[project.scripts]
better-ssh = "better_ssh.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["better_ssh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
markers = [
    "integration: tests that require external services or a real SSH server",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
branch = true
source = ["better_ssh"]

[tool.coverage.report]
show_missing = true
skip_covered = true
